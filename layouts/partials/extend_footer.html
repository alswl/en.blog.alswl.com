{{- /* This partial is cached by PaperMod (partialCached, keyed on layout/kind/params, not page),
     so it must render identical markup for every page. Whether mermaid is actually needed
     is decided client-side. */}}
<script type="module">
  if (document.querySelector("pre.mermaid")) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");

    function isDarkTheme() {
      return document.body.classList.contains("dark");
    }

    function renderMermaid() {
      document.querySelectorAll("pre.mermaid").forEach((el) => {
        if (!el.dataset.mermaidSource) {
          el.dataset.mermaidSource = el.textContent;
        }
        el.removeAttribute("data-processed");
        el.innerHTML = el.dataset.mermaidSource;
      });
      mermaid.initialize({ startOnLoad: false, theme: isDarkTheme() ? "dark" : "default" });
      mermaid.run({ querySelector: "pre.mermaid" });
    }

    renderMermaid();

    const themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", () => setTimeout(renderMermaid, 0));
    }
  }
</script>
