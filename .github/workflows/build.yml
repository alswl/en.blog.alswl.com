name: Build
on:
  push: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
      - name: Install Prettier and ImageMagick
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@latest
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Check content and tools
        run: |
          make test-toolchain
          python3 -B -m scripts check-content --scope push
